[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src/etl/db
    --cov=src/etl/transformers
    --cov=src/etl/extractors
    --cov=src/etl/core
    --cov=src/shared
    --cov=src/meta
    --cov=src/api
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    -ra
    
# Markers for categorizing tests
markers =
    unit: Unit tests (isolated, fast, use manual fixtures)
    integration: Integration tests (use real database)
    db: Database-related tests
    slow: Slow-running tests (queries on 100M+ rows)
    catalog: Catalog table tests (Entidad, Municipio, Localidad)
    quality: Data quality validation tests
    tables(*names): Tablas que el fixture `connection` debe crear
    postgres: Requiere un servidor PostgreSQL de pruebas (ver TEST_POSTGRES_URL
        en conftest.py). Se saltan solos cuando no hay servidor alcanzable.

# Logging
log_cli = false
log_cli_level = INFO
