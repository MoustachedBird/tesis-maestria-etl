[project]
name = "tesis-core"
version = "0.1.0"
description = "Backend y ETL para Tesis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "pydantic-settings",
    "polars",
    "python-dotenv",
    "pyarrow>=22.0.0",
    "numpy",
    "scikit-learn>=1.8.0",
    "rapidfuzz>=3.14.3",
    "sqlalchemy>=2.0.46",
    "alembic>=1.18.1",
    # psycopg3, no psycopg2: `copy.py` escribe con COPY ... FROM STDIN en
    # formato BINARY, que psycopg2 no soporta (su copy_expert solo maneja
    # texto/CSV). Con 82.9M filas el parseo de texto del servidor no es un
    # detalle. Ver arquitectura.md Fase 3.3.
    "psycopg[binary]>=3.2",
    "structlog>=24.1.0",
    "pyyaml>=6.0.0",
    "rich>=14.2.0",
    "typer>=0.21.1",
    "requests>=2.32.5",
    "selenium>=4.39.0",
    "beautifulsoup4",
    "shellingham",
    "h3>=4.5.0",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
