[project]
name = "tesis-core"
version = "0.1.0"
description = "Backend y ETL para Tesis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "duckdb",
    "polars",
    "python-dotenv",
    "pyarrow>=22.0.0",
    "scikit-learn>=1.8.0",
    "thefuzz>=0.22.1",
    "dateparser>=1.2.2",
    "rapidfuzz>=3.14.3",
    "psutil>=7.2.1",
]

[dependency-groups]
etl = [
    "typer",
    "rich",
    "selenium",
    "requests",
    "beautifulsoup4",
    "shellingham"
]
