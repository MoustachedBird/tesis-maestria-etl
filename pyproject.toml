[project]
name = "tesis-core"
version = "0.1.0"
description = "Backend y ETL para Tesis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "duckdb",
    "polars",
    "python-dotenv"
]

[dependency-groups]
etl = [
    "typer",
    "rich",
    "selenium",
    "requests",
    "beautifulsoup4",
    "shellingham"
]
