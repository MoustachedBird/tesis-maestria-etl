# ============================================================================
# ETL Core — stack de contenedores (arquitectura.md §2.1)
# ============================================================================
# Este archivo es la ÚNICA interfaz de ejecución del proyecto. No hay Makefile
# ni ejecución nativa: todo corre en contenedor, en la workstation Linux
# (48 hilos / 125 GiB, inventario en docs/entorno_linux.md) y en cualquier
# máquina de desarrollo. Los límites de recursos vienen del .env para no fijar
# números de una máquina aquí.
#
# ── Levantar el stack ───────────────────────────────────────────────────────
#   docker compose build                 # construye las imágenes
#   docker compose up -d                 # Postgres + migraciones. Base lista.
#   docker compose down                  # detiene (conserva los datos)
#   docker compose down -v               # BORRA el volumen de datos
#
# ── Pipeline (one-shot, profile `manual`) ───────────────────────────────────
#   docker compose run --rm etl extract
#   docker compose run --rm etl transform --only clee-radio
#   docker compose run --rm etl pipeline
#
# ── Herramientas (one-shot, profile `tools`) ────────────────────────────────
#   docker compose run --rm tools pytest
#   docker compose run --rm tools python -m scripts.smoke_fase3
#   docker compose run --rm tools alembic current --verbose
#   docker compose run --rm tools ruff check src/ tests/ scripts/ alembic/
#
# ── Base de datos ───────────────────────────────────────────────────────────
#   docker compose exec postgres psql -U etl_rw -d mipymes
#   docker compose logs -f postgres
#
# Los servicios one-shot van bajo profile para que `up` no los arranque:
# `docker compose run` activa el profile de su servicio automáticamente.

services:
  postgres:
    image: postgres:17
    container_name: etl-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mipymes}
      POSTGRES_USER: ${POSTGRES_USER:-etl_rw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      # Locale e índices deterministas: sin esto el orden de los VARCHAR
      # depende del locale del host y los índices no son reproducibles.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"

    # Tuning: valores derivados de la RAM y los núcleos de la máquina
    # (docs/entorno_linux.md §2). Van como flags y no en un postgresql.conf
    # montado para que una sola fuente —el .env— los controle.
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-32GB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-90GB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-16GB}
      -c work_mem=${PG_WORK_MEM:-256MB}
      -c max_worker_processes=${PG_MAX_WORKER_PROCESSES:-48}
      -c max_parallel_workers=${PG_MAX_PARALLEL_WORKERS:-24}
      -c max_parallel_workers_per_gather=${PG_MAX_PARALLEL_PER_GATHER:-8}
      -c max_parallel_maintenance_workers=${PG_MAX_PARALLEL_MAINTENANCE:-8}
      -c random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      -c effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}
      -c maintenance_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}
      -c wal_buffers=${PG_WAL_BUFFERS:-64MB}
      -c max_wal_size=${PG_MAX_WAL_SIZE:-16GB}
      -c min_wal_size=${PG_MIN_WAL_SIZE:-2GB}
      -c checkpoint_completion_target=0.9
      -c checkpoint_timeout=15min
      -c autovacuum_max_workers=6
      -c autovacuum_vacuum_cost_limit=2000
      -c default_statistics_target=200
      -c huge_pages=try
      -c max_locks_per_transaction=${PG_MAX_LOCKS_PER_TRANSACTION:-256}

    volumes:
      # Volumen NOMBRADO, nunca bind mount: en la Linux vive en
      # /var/lib/docker/volumes (misma partición ext4 de 1.7 TB) y el IO es
      # nativo. Un bind mount desde macOS pasaría por virtiofs.
      - pgdata:/var/lib/postgresql/data

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    # El default de Docker son 64 MB y Postgres usa memoria compartida
    # dinámica para las consultas paralelas: con 64 MB un plan paralelo
    # grande falla con "could not resize shared memory segment".
    shm_size: ${PG_SHM_SIZE:-1gb}

    deploy:
      resources:
        limits:
          cpus: "${CPUS_POSTGRES:-32}"
          memory: ${MEM_POSTGRES:-48g}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etl_rw} -d ${POSTGRES_DB:-mipymes}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Migraciones: one-shot, no daemon. Es un servicio y no un target del
  # Makefile para que el encadenamiento viva donde vive el resto de la
  # topologia: `docker compose up -d` espera el healthcheck de postgres,
  # aplica el baseline y sale. La base queda lista con UN comando.
  # Alembic es idempotente, asi que re-levantar el stack no hace nada.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.etl
      target: tools
    image: tesis-etl-tools:local
    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    env_file: .env
    environment:
      POSTGRES_HOST: postgres

    command: ["alembic", "upgrade", "head"]

    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      # Los seeds que siembra el baseline.
      - ./data:/app/data

  etl:
    profiles: ["manual"]
    build:
      context: .
      dockerfile: Dockerfile.etl
      target: etl
    image: tesis-etl:local

    depends_on:
      migrate:
        condition: service_completed_successfully

    env_file: .env
    environment:
      # Dentro de la red de compose la base es "postgres", no localhost.
      POSTGRES_HOST: postgres
      HEADLESS: "true"
      # Acota los hilos de Polars para que no compitan con los workers de
      # Postgres por los mismos núcleos (arquitectura.md §2.3.2).
      POLARS_MAX_THREADS: ${POLARS_MAX_THREADS:-16}

    volumes:
      # Bronze y los seeds entran por aquí; Silver y Gold ya viven en la base.
      - ./data:/app/data
      - ./logs:/app/logs

    # Chromium (scraping de DENUE) se cae en Docker sin memoria compartida.
    shm_size: ${ETL_SHM_SIZE:-2gb}

    deploy:
      resources:
        limits:
          cpus: "${CPUS_ETL:-16}"
          memory: ${MEM_ETL:-32g}

  # Herramientas one-shot: tests y scripts de validacion. Sin Chrome, asi que
  # corre igual en la workstation (amd64) y en la Mac (arm64) -- no hace falta
  # un modo "nativo" aparte.
  #
  #   docker compose run --rm tools pytest
  #   docker compose run --rm tools python -m scripts.smoke_fase3
  #   docker compose run --rm tools ruff check src/
  #
  # El entrypoint de la imagen es `uv run`, asi que el comando va tal cual.
  tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.etl
      target: tools
    image: tesis-etl-tools:local

    depends_on:
      migrate:
        condition: service_completed_successfully

    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      # Los tests marcados `postgres` derivan la base de pruebas de
      # POSTGRES_DB con sufijo _test; aqui se deja explicito para que el
      # nombre no dependa de la derivacion.
      TEST_POSTGRES_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-etl_rw}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mipymes}_test
      POLARS_MAX_THREADS: ${POLARS_MAX_THREADS:-16}

    volumes:
      # El codigo se monta en vez de hornearse: editar y re-correr los tests
      # no debe costar un rebuild. Los seeds y Bronze entran por ./data.
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./data:/app/data
      - ./logs:/app/logs

    deploy:
      resources:
        limits:
          cpus: "${CPUS_TOOLS:-8}"
          memory: ${MEM_TOOLS:-8g}

  # API de consulta. Daemon, no one-shot, asi que no lleva profile: entra con
  # `docker compose up`. Usa la imagen `tools` porque fastapi es dependencia
  # del proyecto; la Fase 6 le da su propio Dockerfile sin Selenium ni
  # rapidfuzz y lo baja al rol de solo lectura `api_ro`.
  api:
    build:
      context: .
      dockerfile: Dockerfile.etl
      target: tools
    image: tesis-etl-tools:local
    restart: unless-stopped

    depends_on:
      migrate:
        condition: service_completed_successfully

    env_file: .env
    environment:
      POSTGRES_HOST: postgres

    command: ["fastapi", "run", "src/api/main.py", "--host", "0.0.0.0", "--port", "8000"]

    ports:
      - "${API_PORT:-8000}:8000"

    volumes:
      - ./src:/app/src

    deploy:
      resources:
        limits:
          cpus: "${CPUS_API:-4}"
          memory: ${MEM_API:-4g}

volumes:
  pgdata:
    name: etl-pgdata
